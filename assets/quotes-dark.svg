<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220"><g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="412" height="220" rx="24" fill="#1C1C1E"/>
<text x="28" y="72" font-size="64" font-weight="700" fill="#2997FF">“</text><text x="32" y="100" font-size="18" font-weight="500" fill="#F5F5F7">Testing is the process of evaluating a</text><text x="32" y="128" font-size="18" font-weight="500" fill="#F5F5F7">product by learning about it through</text><text x="32" y="156" font-size="18" font-weight="500" fill="#F5F5F7">exploration and experimentation.</text>
<text x="32" y="190" font-size="15" fill="#A1A1A6">— Michael Bolton</text><rect x="428" y="0" width="412" height="220" rx="24" fill="#1C1C1E"/>
<text x="456" y="72" font-size="64" font-weight="700" fill="#2997FF">“</text><text x="460" y="100" font-size="18" font-weight="500" fill="#F5F5F7">A good tester is a detective,</text><text x="460" y="128" font-size="18" font-weight="500" fill="#F5F5F7">not a robot.</text>
<text x="460" y="190" font-size="15" fill="#A1A1A6">— Jonathon Wright</text></g></svg>