<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220"><g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="412" height="220" rx="24" fill="#F5F5F7"/>
<text x="28" y="72" font-size="64" font-weight="700" fill="#0071E3">“</text><text x="32" y="100" font-size="18" font-weight="500" fill="#1D1D1F">Testing is the process of evaluating a</text><text x="32" y="128" font-size="18" font-weight="500" fill="#1D1D1F">product by learning about it through</text><text x="32" y="156" font-size="18" font-weight="500" fill="#1D1D1F">exploration and experimentation.</text>
<text x="32" y="190" font-size="15" fill="#6E6E73">— Michael Bolton</text><rect x="428" y="0" width="412" height="220" rx="24" fill="#F5F5F7"/>
<text x="456" y="72" font-size="64" font-weight="700" fill="#0071E3">“</text><text x="460" y="100" font-size="18" font-weight="500" fill="#1D1D1F">A good tester is a detective,</text><text x="460" y="128" font-size="18" font-weight="500" fill="#1D1D1F">not a robot.</text>
<text x="460" y="190" font-size="15" fill="#6E6E73">— Jonathon Wright</text></g></svg>